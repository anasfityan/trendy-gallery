<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Importer Lab</title>
<style>
:root{--bg:#0b0d10;--p:#14171b;--line:#2a3037;--gold:#d6a84b;--green:#4fce91;--red:#e1787d;--text:#f5f1e8;--muted:#939aa3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 14px 60px}.head{display:flex;justify-content:space-between;gap:12px;align-items:end}.title{font-size:27px;font-weight:800}.sub{color:var(--muted);font-size:13px;margin-top:6px}.tag{border:1px solid #4d4024;color:#e7c979;padding:7px 10px;border-radius:999px;font-size:12px}.box,.panel{background:var(--p);border:1px solid var(--line);border-radius:17px;padding:15px}.box{margin-top:18px}.form{display:grid;grid-template-columns:1fr auto;gap:8px}.input{height:50px;background:#0e1114;border:1px solid var(--line);border-radius:12px;color:#fff;padding:0 13px;direction:ltr;text-align:left}.btn{height:50px;border:0;border-radius:12px;padding:0 22px;background:var(--gold);font-weight:800;cursor:pointer}.samples{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.sample{background:#1a1e23;border:1px solid var(--line);color:#ddd;border-radius:9px;padding:8px 10px;cursor:pointer}.status,.err{display:none;margin-top:12px}.status.on{display:block;color:var(--muted)}.err.on{display:block;background:#251416;border:1px solid #5b3034;color:#f2a5a9;padding:11px;border-radius:10px}.result{display:none;margin-top:12px}.result.on{display:block}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:10px}.main{width:100%;aspect-ratio:1/1;object-fit:contain;background:#f7f7f7;border-radius:12px}.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:7px}.thumb{width:100%;aspect-ratio:1/1;object-fit:cover;background:#f7f7f7;border-radius:7px;cursor:pointer}.name{font-weight:800;font-size:19px;line-height:1.5}.price{font-size:26px;color:var(--green);font-weight:900;margin:12px 0}.old{font-size:13px;color:#c6a56c;margin-top:-7px;margin-bottom:12px}.row{border-top:1px solid var(--line);padding:11px 0}.label{color:var(--muted);font-size:11px;margin-bottom:7px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid #3a4149;border-radius:999px;padding:6px 8px;font-size:12px}.details{margin:0;padding-right:18px;color:#d8dde3;font-size:13px;line-height:1.75}.details li+li{margin-top:5px}.raw{margin-top:10px}.raw pre{direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word;color:#abb4bf;font-size:11px}@media(max-width:760px){.head{align-items:start;flex-direction:column}.form,.grid{grid-template-columns:1fr}.btn{width:100%}.thumbs{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body><div class="wrap"><div class="head"><div><div class="title">مختبر استيراد المنتجات</div><div class="sub">نجمع الصور الحقيقية مرة واحدة، ثم السعر واللون والمقاس وتفاصيل المنتج من نفس الصفحة.</div></div><div class="tag">Direct Import · v3</div></div>
<div class="box"><div class="form"><input id="url" class="input" placeholder="ألصق رابط المنتج"><button id="go" class="btn">استيراد</button></div><div class="samples"><button class="sample" data-url="https://www.shulebags.com/giglio-spor-omuz-cantasi-vizon">Shulebags</button><button class="sample" data-url="https://www.nisantasishoes.com/lorea-kahve-saten-puantiye-desenli-fiyonk-detayli-kadin-topuklu-ayakkabi-14833?numara=39">Nişantaşı Shoes</button></div><div id="status" class="status">جاري تحليل صفحة المنتج وتفاصيله…</div><div id="err" class="err"></div></div>
<div id="result" class="result"><div class="grid"><div class="panel"><img id="main" class="main" alt="صورة المنتج"><div id="thumbs" class="thumbs"></div></div><div class="panel"><div id="name" class="name">—</div><div id="price" class="price">—</div><div id="discount" class="old"></div><div class="row"><div class="label">اللون</div><div id="colors" class="chips"></div></div><div class="row"><div class="label">المقاسات</div><div id="sizes" class="chips"></div></div><div class="row"><div class="label">التصنيف / المصدر</div><div class="chips"><span id="cat" class="chip"></span><span id="source" class="chip"></span><span id="count" class="chip"></span></div></div><div class="row"><div class="label">تفاصيل المنتج</div><ul id="details" class="details"></ul></div></div></div><details class="panel raw"><summary>JSON الخام</summary><pre id="raw"></pre></details></div></div>
<script>
const API='https://uoydoungeplepusrsill.supabase.co/functions/v1/product-import-api';
const $=x=>document.getElementById(x);
const catName={bags:'حقائب',shoes:'أحذية',clothes:'ملابس',acc:'إكسسوارات'};
const proxy=src=>API+'?image='+encodeURIComponent(src);
function chips(id,a){const e=$(id);e.innerHTML='';(a&&a.length?a:['غير موجود']).forEach(v=>{const s=document.createElement('span');s.className='chip';s.textContent=v;e.appendChild(s)})}
function details(a){const e=$('details');e.innerHTML='';(a&&a.length?a:['لم يتم العثور على تفاصيل إضافية']).forEach(v=>{const li=document.createElement('li');li.textContent=v;e.appendChild(li)})}
function setImage(el,src){el.dataset.original=src;el.onerror=()=>{if(el.src!==src){el.onerror=null;el.src=src}else{el.style.opacity='.2'}};el.style.opacity='1';el.src=proxy(src)}
async function run(){const url=$('url').value.trim();if(!url)return;$('go').disabled=true;$('status').classList.add('on');$('err').classList.remove('on');$('result').classList.remove('on');try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url})});const d=await r.json();if(!r.ok)throw new Error(d.error||('HTTP '+r.status));const imgs=d.images||[];$('name').textContent=d.name||'—';$('price').textContent=d.price?d.price+' '+(d.currency||'TRY'):'السعر غير موجود';$('discount').textContent=d.discountPrice?'سعر الخصم: '+d.discountPrice+' '+(d.currency||'TRY'):'';chips('colors',d.colors);chips('sizes',d.sizes);details(d.details);$('cat').textContent=catName[d.category]||d.category||'—';$('source').textContent=d.source||'—';$('count').textContent=imgs.length+' صورة فريدة';$('raw').textContent=JSON.stringify(d,null,2);$('thumbs').innerHTML='';if(imgs[0])setImage($('main'),imgs[0]);else $('main').removeAttribute('src');imgs.forEach(src=>{const im=document.createElement('img');im.className='thumb';im.loading='lazy';im.alt='صورة مصغرة';setImage(im,src);im.onclick=()=>setImage($('main'),src);$('thumbs').appendChild(im)});$('result').classList.add('on')}catch(e){$('err').textContent='فشل الاستيراد: '+e.message;$('err').classList.add('on')}finally{$('go').disabled=false;$('status').classList.remove('on')}}
$('go').onclick=run;document.querySelectorAll('.sample').forEach(b=>b.onclick=()=>{$('url').value=b.dataset.url;run()});$('url').onkeydown=e=>{if(e.key==='Enter')run()};
</script></body></html>
