<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Importer Lab</title>
<style>
:root{--bg:#0b0d10;--p:#14171b;--line:#2a3037;--gold:#d6a84b;--green:#4fce91;--red:#e1787d;--text:#f5f1e8;--muted:#939aa3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 14px 60px}.head{display:flex;justify-content:space-between;gap:12px;align-items:end}.title{font-size:27px;font-weight:800}.sub{color:var(--muted);font-size:13px;margin-top:6px}.tag{border:1px solid #4d4024;color:#e7c979;padding:7px 10px;border-radius:999px;font-size:12px}.box,.panel{background:var(--p);border:1px solid var(--line);border-radius:17px;padding:15px}.box{margin-top:18px}.form{display:grid;grid-template-columns:1fr auto;gap:8px}.input{height:50px;background:#0e1114;border:1px solid var(--line);border-radius:12px;color:#fff;padding:0 13px;direction:ltr;text-align:left}.btn{height:50px;border:0;border-radius:12px;padding:0 22px;background:var(--gold);font-weight:800;cursor:pointer}.samples{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.sample{background:#1a1e23;border:1px solid var(--line);color:#ddd;border-radius:9px;padding:8px 10px;cursor:pointer}.status,.err{display:none;margin-top:12px}.status.on{display:block;color:var(--muted)}.err.on{display:block;background:#251416;border:1px solid #5b3034;color:#f2a5a9;padding:11px;border-radius:10px}.result{display:none;margin-top:12px}.result.on{display:block}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:10px}.main{width:100%;aspect-ratio:1/1;object-fit:contain;background:#f7f7f7;border-radius:12px}.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:7px}.thumb{width:100%;aspect-ratio:1/1;object-fit:cover;background:#f7f7f7;border-radius:7px;cursor:pointer}.name{font-weight:800;font-size:19px;line-height:1.5}.price{font-size:26px;color:var(--green);font-weight:900;margin:12px 0}.old{font-size:13px;color:#c6a56c;margin-top:-7px;margin-bottom:12px}.row{border-top:1px solid var(--line);padding:11px 0}.row.hidden{display:none}.label{color:var(--muted);font-size:11px;margin-bottom:7px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid #3a4149;border-radius:999px;padding:6px 8px;font-size:12px}.dimension{border-color:#6b572c;color:#edd08b}.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.spec{background:#101317;border:1px solid #303740;border-radius:10px;padding:9px 10px}.spec-k{font-size:10px;color:var(--muted);margin-bottom:4px}.spec-v{font-size:13px;font-weight:700;line-height:1.5}.details{margin:0;padding-right:18px;color:#c4cbd3;font-size:12px;line-height:1.7}.details li+li{margin-top:5px}.raw{margin-top:10px}.raw pre{direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word;color:#abb4bf;font-size:11px}@media(max-width:760px){.head{align-items:start;flex-direction:column}.form,.grid{grid-template-columns:1fr}.btn{width:100%}.thumbs{grid-template-columns:repeat(4,1fr)}.specs{grid-template-columns:1fr 1fr}}
</style></head>
<body><div class="wrap"><div class="head"><div><div class="title">مختبر استيراد المنتجات</div><div class="sub">يستخرج المعلومات التي يحتاجها الزبون فعليًا بحسب نوع المنتج.</div></div><div class="tag">General Import · v5</div></div>
<div class="box"><div class="form"><input id="url" class="input" placeholder="ألصق رابط المنتج"><button id="go" class="btn">استيراد</button></div><div class="samples"><button class="sample" data-url="https://www.gratis.com/el-vucut-kremleri/bee-beauty-dogal-kiraz-cicegi-ozu-el-kremi-75-ml-p-10194839">Gratis كريم</button><button class="sample" data-url="https://www.gratis.com/fondoten/note-matte-lock-foundation-fondoten-100-sari-alt-ton-p-10218914">Gratis مكياج</button><button class="sample" data-url="https://altuda.com.tr/products/kadin-seritli-shopper-omuz-cantasi-boris-pembe">Altuda</button><button class="sample" data-url="https://www.shulebags.com/giglio-spor-omuz-cantasi-vizon">Shulebags</button><button class="sample" data-url="https://www.nisantasishoes.com/lorea-kahve-saten-puantiye-desenli-fiyonk-detayli-kadin-topuklu-ayakkabi-14833?numara=39">Nişantaşı</button><button class="sample" data-url="https://www.hepsiburada.com/pirok-store-samsung-galaxy-s26-ultra-magsafe-uyumlu-kablosuz-sarj-destekli-yumusak-soft-mukemmel-manyetik-esnek-lansman-silikon-kilif-p-HBCV0000D2MAO4">Hepsiburada</button><button class="sample" data-url="https://www.stradivarius.com/tr/en/graphic-vneck-tshirt-l06703295?categoryId=1718528&colorId=100&pelement=520351835">Stradivarius</button><button class="sample" data-url="https://www.bershka.com/tr/kargo-parasut-pantolon-l03046335-c0p227042041.html">Bershka</button></div><div id="status" class="status">جاري تحليل المنتج واستخراج مواصفاته المهمة…</div><div id="err" class="err"></div></div>
<div id="result" class="result"><div class="grid"><div class="panel"><img id="main" class="main" alt="صورة المنتج"><div id="thumbs" class="thumbs"></div></div><div class="panel"><div id="name" class="name">—</div><div id="price" class="price">—</div><div id="discount" class="old"></div><div id="colorRow" class="row hidden"><div class="label">اللون</div><div id="colors" class="chips"></div></div><div id="measureRow" class="row hidden"><div id="measureLabel" class="label">المقاسات / الأبعاد</div><div id="sizes" class="chips"></div></div><div id="specRow" class="row hidden"><div class="label">المواصفات المهمة</div><div id="specs" class="specs"></div></div><div id="extraRow" class="row hidden"><div class="label">معلومات إضافية</div><div id="extra" class="chips"></div></div><div class="row"><div class="label">التصنيف / المصدر</div><div class="chips"><span id="cat" class="chip"></span><span id="source" class="chip"></span><span id="count" class="chip"></span></div></div><details class="row"><summary class="label" style="cursor:pointer">الوصف الأصلي — للمرجع فقط</summary><ul id="details" class="details"></ul></details></div></div><details class="panel raw"><summary>JSON الخام</summary><pre id="raw"></pre></details></div></div>
<script>
const IMPORT_API='https://uoydoungeplepusrsill.supabase.co/functions/v1/product-import-api';
const API='https://uoydoungeplepusrsill.supabase.co/functions/v1/product-unified-api';
const $=x=>document.getElementById(x);
const catName={bags:'حقائب',shoes:'أحذية',clothes:'ملابس',acc:'إكسسوارات',cosmetics:'عناية / تجميل',other:'منتج'};
const specLabels={dimensions:'الأبعاد',strapLength:'طول الحزام',material:'الخامة',closure:'الإغلاق',compartments:'عدد الأقسام',waterResistant:'مقاومة الماء',heelHeight:'ارتفاع الكعب',heelType:'نوع الكعب',fit:'القَصّة / القالب',composition:'تركيبة القماش',amount:'الكمية / الحجم',variant:'النوع / الرائحة',shade:'درجة اللون',spf:'الحماية SPF',form:'التركيبة / الشكل',finish:'المظهر النهائي',skinType:'نوع البشرة',coverage:'التغطية',sole:'النعل',length:'الطول',stretch:'مرونة القماش',compatibility:'التوافق',features:'الميزات',modelSize:'مقاس الموديل'};
const PROXY_HOSTS=new Set(['static.ticimax.cloud','cdn.myikas.com','api.gratis.retter.io','cdn.shopify.com']);
const proxy=src=>{try{return PROXY_HOSTS.has(new URL(src).hostname)?IMPORT_API+'?image='+encodeURIComponent(src):src}catch{return src}};
function fillChips(id,a,cls=''){const e=$(id);e.innerHTML='';(a||[]).forEach(v=>{const s=document.createElement('span');s.className='chip '+cls;s.textContent=v;e.appendChild(s)})}
function details(a){const e=$('details');e.innerHTML='';(a&&a.length?a:['لا توجد تفاصيل إضافية']).forEach(v=>{const li=document.createElement('li');li.textContent=v;e.appendChild(li)})}
function setImage(el,src){el.dataset.original=src;el.onerror=()=>{if(el.src!==src){el.onerror=null;el.src=src}else{el.style.opacity='.2'}};el.style.opacity='1';el.src=proxy(src)}
function showRow(id,on){$(id).classList.toggle('hidden',!on)}
function renderSpecs(obj,base){const box=$('specs');box.innerHTML='';const merged={...(obj||{})};if(base.volume&&!merged.amount)merged.amount=base.volume;if(base.variant&&!merged.variant)merged.variant=base.variant;if(base.dimensions&&!merged.dimensions)merged.dimensions=base.dimensions;Object.entries(merged).forEach(([k,v])=>{if(v==null||v===''||v===false)return;const d=document.createElement('div');d.className='spec';const a=document.createElement('div');a.className='spec-k';a.textContent=specLabels[k]||k;const b=document.createElement('div');b.className='spec-v';b.textContent=Array.isArray(v)?v.join(' · '):(v===true?'نعم':String(v));d.append(a,b);box.appendChild(d)});showRow('specRow',box.children.length>0)}
async function fetchJson(endpoint,url){const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url})});const d=await r.json();if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}
async function run(){const url=$('url').value.trim();if(!url)return;$('go').disabled=true;$('status').classList.add('on');$('err').classList.remove('on');$('result').classList.remove('on');try{const d=await fetchJson(API,url);const specRes={keySpecs:d.keySpecs||{},brand:d.brand||'',source:d.smartSpecsSource||null};const imgs=d.images||[];$('name').textContent=d.name||'—';$('price').textContent=d.price?d.price+' '+(d.currency||'TRY'):'السعر غير موجود';$('discount').textContent=d.discountPrice?'سعر الخصم: '+d.discountPrice+' '+(d.currency||'TRY'):'';
const colors=d.colors||[];showRow('colorRow',colors.length>0);fillChips('colors',colors);
const measures=d.sizes?.length?d.sizes:(d.dimensions?[d.dimensions]:[]);showRow('measureRow',measures.length>0);$('measureLabel').textContent=d.sizes?.length?'المقاسات':'الأبعاد';fillChips('sizes',measures,d.dimensions&&!d.sizes?.length?'dimension':'');
renderSpecs(specRes?.keySpecs||{},d);
const extra=[];if(d.brand||specRes?.brand)extra.push('العلامة: '+(d.brand||specRes.brand));showRow('extraRow',extra.length>0);fillChips('extra',extra);
details(d.details);$('cat').textContent=catName[d.category]||d.category||'—';$('source').textContent=(d.source||'—')+(d.unifiedSource?' + unified':'')+(specRes?.source?' + smart specs':'');$('count').textContent=imgs.length+' صورة فريدة';$('raw').textContent=JSON.stringify({product:d},null,2);$('thumbs').innerHTML='';if(imgs[0])setImage($('main'),imgs[0]);else $('main').removeAttribute('src');imgs.forEach(src=>{const im=document.createElement('img');im.className='thumb';im.loading='lazy';im.alt='صورة مصغرة';setImage(im,src);im.onclick=()=>setImage($('main'),src);$('thumbs').appendChild(im)});$('result').classList.add('on')}catch(e){$('err').textContent='فشل الاستيراد: '+e.message;$('err').classList.add('on')}finally{$('go').disabled=false;$('status').classList.remove('on')}}
$('go').onclick=run;document.querySelectorAll('.sample').forEach(b=>b.onclick=()=>{$('url').value=b.dataset.url;run()});$('url').onkeydown=e=>{if(e.key==='Enter')run()};
</script></body></html>
