name: Validate protected product importer
on:
  push:
    paths:
      - 'protected_importer.py'
      - 'protected_importer_entry.py'
      - '.github/workflows/test-protected-importer.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q curl-cffi
      - name: Test protected importer matrix v4
        run: |
          python - <<'PY'
          import json,subprocess
          urls={
            'hepsiburada':'https://www.hepsiburada.com/pirok-store-samsung-galaxy-s26-ultra-magsafe-uyumlu-kablosuz-sarj-destekli-yumusak-soft-mukemmel-manyetik-esnek-lansman-silikon-kilif-p-HBCV0000D2MAO4',
            'stradivarius':'https://www.stradivarius.com/tr/en/graphic-vneck-tshirt-l06703295?categoryId=1718528&colorId=100&pelement=520351835',
            'bershka':'https://www.bershka.com/tr/erkek/giyim/pantolon-n3288.html?celement=1010193241'
          }
          out={}
          for k,u in urls.items():
            p=subprocess.run(['python','-c','import json,sys; from protected_importer_entry import import_product; print(json.dumps(import_product(sys.argv[1]),ensure_ascii=False))',u],capture_output=True,text=True,timeout=90)
            if p.returncode:
              try: d=json.loads(p.stdout.strip() or '{}')
              except: d={}
              out[k]={'error':d.get('error') or p.stderr[-1000:] or p.stdout[-1000:]}
              continue
            d=json.loads(p.stdout)
            out[k]={
              'name':d.get('name'),'price':d.get('price'),'currency':d.get('currency'),'category':d.get('category'),
              'images':len(d.get('images') or []),'colors':d.get('colors'),'sizes':d.get('sizes'),
              'brand':d.get('brand'),'keySpecs':d.get('keySpecs'),'description':d.get('description'),'source':d.get('source')
            }
          open('protected-import-results.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add protected-import-results.json
          git diff --cached --quiet || git commit -m 'Record protected importer validation'
          git push
