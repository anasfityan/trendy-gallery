name: Test Inditex direct endpoint
on:
  push:
    paths:
      - '.github/workflows/test-inditex-direct.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call Stradivarius productsArray
        run: |
          set -e
          curl -sS 'https://uoydoungeplepusrsill.supabase.co/functions/v1/inditex-direct-test?pid=520351835' > inditex-direct-result.json
          python - <<'PY'
          import json
          d=json.load(open('inditex-direct-result.json'))
          print('status',d.get('status'))
          print('contentType',d.get('contentType'))
          print((d.get('body') or '')[:2000])
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add inditex-direct-result.json
          git diff --cached --quiet || git commit -m 'Record Inditex direct endpoint test'
          git push
