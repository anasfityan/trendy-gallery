name: Bump card cache v13
on:
  push:
    paths:
      - '.github/workflows/bump-card-cache-v13.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force latest card script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lab.html')
          s=p.read_text()
          s=s.replace('General Import · v12','General Import · v13')
          s=s.replace('./lab-card.js?v=8','./lab-card.js?v=9')
          p.write_text(s)
          PY
      - name: Commit cache bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lab.html
          git diff --cached --quiet && exit 0
          git commit -m 'Force card renderer v13 cache refresh'
          git push
