name: Validate customer product specs
on:
  push:
    paths:
      - '.github/workflows/test-customer-specs.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test specs matrix v4
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import json, subprocess
          api='https://uoydoungeplepusrsill.supabase.co/functions/v1/product-specs-api'
          urls={
            'shulebags':'https://www.shulebags.com/giglio-spor-omuz-cantasi-vizon',
            'nisantasi':'https://www.nisantasishoes.com/lorea-kahve-saten-puantiye-desenli-fiyonk-detayli-kadin-topuklu-ayakkabi-14833?numara=39',
            'gratis_cream':'https://www.gratis.com/el-vucut-kremleri/bee-beauty-dogal-kiraz-cicegi-ozu-el-kremi-75-ml-p-10194839',
            'gratis_deodorant':'https://www.gratis.com/kadin-deodorant-sprey/rexona-clinical-protection-kadin-sprey-deodorant-confidence-150-ml-p-10315380',
            'altuda':'https://altuda.com.tr/products/kadin-seritli-shopper-omuz-cantasi-boris-pembe'
          }
          out={}
          for k,u in urls.items():
              p=subprocess.run(['curl','-sS','-w','\nHTTP:%{http_code}','-H','content-type: application/json','-d',json.dumps({'url':u}),api],capture_output=True,text=True,timeout=120)
              body,_,code=p.stdout.rpartition('\nHTTP:')
              try:d=json.loads(body)
              except:d={'error':'invalid_json','raw':body[:400]}
              out[k]={'http':int(code or 0),**d}
          open('customer-specs-results.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add customer-specs-results.json
          git diff --cached --quiet || git commit -m 'Record customer specs validation'
          git push
