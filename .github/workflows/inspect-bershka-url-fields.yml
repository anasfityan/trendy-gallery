name: Inspect Bershka URL bridge fields
on:
  push:
    paths:
      - '.github/workflows/inspect-bershka-url-fields.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q curl-cffi
      - name: Inspect one live product deeply
        run: |
          python - <<'PY'
          import json
          from curl_cffi import requests
          base='https://www.bershka.com'; root=f'{base}/itxrest/3/catalog/store/44109521/40259537'; cat='1010193216'; pid='227042041'
          s=requests.Session(impersonate='chrome'); s.headers.update({'Accept':'application/json,*/*','Accept-Language':'tr-TR,tr;q=0.9','Referer':base+'/tr/'})
          try:s.get(base+'/tr/',timeout=20)
          except:pass
          u=f'{root}/productsArray?languageId=-43&productIds={pid}&categoryId={cat}&appId=1&locale=tr_TR'
          p=(s.get(u,timeout=35).json().get('products') or [{}])[0]
          out={k:p.get(k) for k in ['id','name','nameEn','productUrl','productUrlParam','alternativeProductId','field5','mainColorid','familyCode','subFamilyCode','section','family','subFamily','keywords','relatedCategories','attributes']}
          open('bershka-url-fields.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add bershka-url-fields.json
          git diff --cached --quiet || git commit -m 'Record Bershka URL bridge fields'
          git push
