name: Test product image proxy

on:
  push:
    paths:
      - '.github/workflows/test-image-proxy.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate proxied images
        shell: bash
        run: |
          set -e
          API='https://uoydoungeplepusrsill.supabase.co/functions/v1/product-import-api?image='
          SHULE='https://static.ticimax.cloud/55374/uploads/urunresimleri/buyuk/94822e8d-dee3-4dfb-aa2f-6a2f602e2f52-3c8-81.jpeg'
          NIS='https://cdn.myikas.com/images/4986bc63-964e-482b-bc1c-6739ed185f15/efbf5d42-f500-4e23-a1cd-49b6d8d2adf9/image_1080.webp'
          SENC=$(python -c "import urllib.parse; print(urllib.parse.quote('$SHULE',safe=''))")
          NENC=$(python -c "import urllib.parse; print(urllib.parse.quote('$NIS',safe=''))")
          curl -sS -D shule.headers -o shule.img "${API}${SENC}"
          curl -sS -D nis.headers -o nis.img "${API}${NENC}"
          python - <<'PY'
          import json,re,os
          def parse(h,p):
              txt=open(h,encoding='latin1').read()
              codes=re.findall(r'HTTP/\S+\s+(\d+)',txt)
              status=int(codes[-1]) if codes else 0
              types=re.findall(r'(?im)^content-type:\s*([^\r\n]+)',txt)
              return {'http':status,'content_type':types[-1].strip() if types else None,'bytes':os.path.getsize(p)}
          out={'shulebags':parse('shule.headers','shule.img'),'nisantasishoes':parse('nis.headers','nis.img')}
          open('image-proxy-results.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add image-proxy-results.json
          git diff --cached --quiet || git commit -m 'Record image proxy results'
          git push
