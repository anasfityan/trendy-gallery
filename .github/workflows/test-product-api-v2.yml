name: Test product importer v2

on:
  push:
    paths:
      - '.github/workflows/test-product-api-v2.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Shulebags and Nisantasi
        shell: bash
        run: |
          set +e
          API='https://uoydoungeplepusrsill.supabase.co/functions/v1/product-import-api'
          curl -sS -o shule.json -X POST "$API" -H 'content-type: application/json' --data '{"url":"https://www.shulebags.com/giglio-spor-omuz-cantasi-vizon"}'
          curl -sS -o nis.json -X POST "$API" -H 'content-type: application/json' --data '{"url":"https://www.nisantasishoes.com/lorea-kahve-saten-puantiye-desenli-fiyonk-detayli-kadin-topuklu-ayakkabi-14833?numara=39"}'
          python - <<'PY'
          import json
          def load(p):
              try:
                  return json.load(open(p,encoding='utf-8'))
              except Exception as e:
                  return {'error':str(e)}
          def summarize(d):
              imgs=d.get('images') or []
              return {
                  'name':d.get('name'), 'price':d.get('price'), 'discountPrice':d.get('discountPrice'),
                  'images':len(imgs), 'unique_images':len(set(imgs)), 'duplicate_images':len(imgs)-len(set(imgs)),
                  'colors':d.get('colors') or [], 'sizes':d.get('sizes') or [],
                  'details':d.get('details') or [], 'source':d.get('source'), 'error':d.get('error')
              }
          out={'shulebags':summarize(load('shule.json')),'nisantasishoes':summarize(load('nis.json'))}
          open('product-api-v2-results.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product-api-v2-results.json
          git diff --cached --quiet || git commit -m 'Record product importer v2 results'
          git push
