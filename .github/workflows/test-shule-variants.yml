name: Test Shulebags variants

on:
  push:
    paths:
      - '.github/workflows/test-shule-variants.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Miura color variants
        shell: bash
        run: |
          API='https://uoydoungeplepusrsill.supabase.co/functions/v1/product-import-api'
          curl -sS -o out.json -X POST "$API" -H 'content-type: application/json' --data '{"url":"https://www.shulebags.com/miura-charm-detayli-orgu-omuz-kahve-6528"}'
          python - <<'PY'
          import json
          d=json.load(open('out.json',encoding='utf-8'))
          out={
            'name':d.get('name'),'current_color':d.get('colors'),
            'variants':d.get('variants') or [],
            'variant_count':len(d.get('variants') or []),
            'source':d.get('source'),'error':d.get('error')
          }
          open('shule-variants-results.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shule-variants-results.json
          git diff --cached --quiet || git commit -m 'Record Shulebags variant results'
          git push
