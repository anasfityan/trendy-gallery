name: Attach backend importer

on:
  push:
    paths:
      - '.github/workflows/attach-backend-importer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tags = '<script src="./enhancements.js?v=15"></script>\n<script src="./product-import-api.js?v=15"></script>\n'
          if 'product-import-api.js' not in s:
              s = s.replace('</body>', tags + '</body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Attach backend product importer [importer-patch]'
          git push
