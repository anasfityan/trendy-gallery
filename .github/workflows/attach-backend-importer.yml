name: Attach backend importer

on:
  push:
    paths:
      - '.github/workflows/attach-backend-importer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch importer loading and disable auto sync
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # index.html: always pin the newest importer URLs and keep sync manual-only.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<script src="\./enhancements\.js(?:\?v=\d+)?"></script>', '<script src="./enhancements.js?v=17"></script>', s)
          s = re.sub(r'<script src="\./product-import-api\.js(?:\?v=\d+)?"></script>', '<script src="./product-import-api.js?v=17"></script>', s)
          if 'product-import-api.js' not in s:
              s = s.replace('</body>', '<script src="./enhancements.js?v=17"></script>\n<script src="./product-import-api.js?v=17"></script>\n</body>')
          old = """  syncSheets();\n  // Auto-refresh every 30 seconds\n  setInterval(()=>syncSheets(),7200000); // 2 hours\n  // Refresh when app becomes visible again (phone switch)\n  document.addEventListener('visibilitychange',()=>{\n    if(!document.hidden) syncSheets();\n  });\n"""
          s = s.replace(old, "  // Sync is manual only. Use the sidebar sync button when needed.\n")
          p.write_text(s, encoding='utf-8')

          # sw.js: importer scripts must never return stale code first.
          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          w = re.sub(r"const CACHE = 'tg-v\d+';", "const CACHE = 'tg-v17';", w)
          w = re.sub(r"const ENHANCEMENT_TAG = '<script src=\"\./enhancements\.js\?v=\d+\"></script>';", "const ENHANCEMENT_TAG = '<script src=\"./enhancements.js?v=17\"></script>';", w)
          w = w.replace("if (path.endsWith('/enhancements.js')) {", "if (path.endsWith('/enhancements.js') || path.endsWith('/product-import-api.js')) {")
          sw.write_text(w, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Force fresh backend importer loading'
          git push
