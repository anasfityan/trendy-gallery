name: Test reader importer

on:
  push:
    paths:
      - '.github/workflows/test-browser-importer.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test active reader importer and save results
        shell: bash
        run: |
          set +e
          ENDPOINT='https://uoydoungeplepusrsill.supabase.co/functions/v1/import-reader'
          KEY='sb_publishable_4N5mjsKVHFfKZglcUO-yBw_iCC9owhz'
          SHULE_CODE=$(curl -sS -o shule.json -w '%{http_code}' -X POST "$ENDPOINT" \
            -H 'content-type: application/json' -H "apikey: $KEY" -H "authorization: Bearer $KEY" \
            --data '{"url":"https://www.shulebags.com/giglio-spor-omuz-cantasi-vizon"}')
          NIS_CODE=$(curl -sS -o nisantasi.json -w '%{http_code}' -X POST "$ENDPOINT" \
            -H 'content-type: application/json' -H "apikey: $KEY" -H "authorization: Bearer $KEY" \
            --data '{"url":"https://www.nisantasishoes.com/lorea-kahve-saten-puantiye-desenli-fiyonk-detayli-kadin-topuklu-ayakkabi-14833?numara=39"}')
          export SHULE_CODE NIS_CODE
          python - <<'PY'
          import json, os
          def read(path):
              try:
                  with open(path, encoding='utf-8') as f: return json.load(f)
              except Exception as e:
                  return {'error': f'invalid_json: {e}'}
          def compact(d, code):
              return {
                  'http': int(code or 0),
                  'name': d.get('name'),
                  'price': d.get('price'),
                  'images': len(d.get('images') or []),
                  'image_urls': (d.get('images') or [])[:5],
                  'colors': d.get('colors') or [],
                  'sizes': d.get('sizes') or [],
                  'category': d.get('category'),
                  'source': d.get('source'),
                  'error': d.get('error')
              }
          out={
              'shulebags': compact(read('shule.json'), os.environ.get('SHULE_CODE','0')),
              'nisantasishoes': compact(read('nisantasi.json'), os.environ.get('NIS_CODE','0'))
          }
          with open('importer-smoke-results.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit smoke results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add importer-smoke-results.json
          git diff --cached --quiet || git commit -m 'Record reader importer smoke results'
          git push
