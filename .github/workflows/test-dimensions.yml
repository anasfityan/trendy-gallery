name: Validate product dimensions

on:
  push:
    paths:
      - '.github/workflows/test-dimensions.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Miura dimensions
        shell: bash
        run: |
          API='https://uoydoungeplepusrsill.supabase.co/functions/v1/product-import-api'
          curl -sS -o result.json -X POST "$API" -H 'content-type: application/json' --data '{"url":"https://www.shulebags.com/miura-charm-detayli-orgu-omuz-kahve-6528"}'
          python - <<'PY'
          import json
          d=json.load(open('result.json',encoding='utf-8'))
          out={k:d.get(k) for k in ('name','dimensions','sizes','colors','price','source')}
          open('dimensions-results.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dimensions-results.json
          git diff --cached --quiet || git commit -m 'Record extracted dimensions result'
          git push
