name: Test Giglio dimensions

on:
  push:
    paths:
      - '.github/workflows/test-giglio-dimensions.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Giglio dimensions
        shell: bash
        run: |
          API='https://uoydoungeplepusrsill.supabase.co/functions/v1/product-import-api'
          curl -sS -o result.json -X POST "$API" -H 'content-type: application/json' --data '{"url":"https://www.shulebags.com/giglio-spor-omuz-cantasi-bej"}'
          python - <<'PY'
          import json
          d=json.load(open('result.json',encoding='utf-8'))
          out={
            'name':d.get('name'),
            'dimensions':d.get('dimensions'),
            'price':d.get('price'),
            'colors':d.get('colors'),
            'source':d.get('source'),
            'details':d.get('details')
          }
          open('giglio-dimensions-results.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add giglio-dimensions-results.json
          git diff --cached --quiet || git commit -m 'Record Giglio dimensions validation'
          git push
