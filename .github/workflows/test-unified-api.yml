name: Validate unified product API
on:
  push:
    paths:
      - '.github/workflows/test-unified-api.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test unified public importer
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          api='https://uoydoungeplepusrsill.supabase.co/functions/v1/product-unified-api'
          urls={
            'shulebags':'https://www.shulebags.com/giglio-spor-omuz-cantasi-vizon',
            'nisantasi':'https://www.nisantasishoes.com/lorea-kahve-saten-puantiye-desenli-fiyonk-detayli-kadin-topuklu-ayakkabi-14833?numara=39',
            'gratis_foundation':'https://www.gratis.com/fondoten/note-matte-lock-foundation-fondoten-100-sari-alt-ton-p-10218914',
            'altuda':'https://altuda.com.tr/products/kadin-seritli-shopper-omuz-cantasi-boris-pembe',
            'protected_check':'https://www.hepsiburada.com/pirok-store-samsung-galaxy-s26-ultra-magsafe-uyumlu-kablosuz-sarj-destekli-yumusak-soft-mukemmel-manyetik-esnek-lansman-silikon-kilif-p-HBCV0000D2MAO4'
          }
          out={}
          for key,url in urls.items():
            req=urllib.request.Request(api,data=json.dumps({'url':url}).encode(),headers={'content-type':'application/json'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=90) as r:
                d=json.loads(r.read().decode())
                out[key]={'http':r.status,'name':d.get('name'),'price':d.get('price'),'category':d.get('category'),'images':len(d.get('images') or []),'colors':d.get('colors'),'sizes':d.get('sizes'),'keySpecs':d.get('keySpecs'),'unifiedSource':d.get('unifiedSource'),'error':d.get('error')}
            except urllib.error.HTTPError as e:
              body=e.read().decode()
              try:d=json.loads(body)
              except:d={'raw':body}
              out[key]={'http':e.code,'error':d.get('error'),'message':d.get('message')}
          open('unified-api-results.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add unified-api-results.json
          git diff --cached --quiet || git commit -m 'Record unified API validation'
          git push
