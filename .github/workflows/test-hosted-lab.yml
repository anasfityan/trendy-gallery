name: Test hosted importer lab

on:
  push:
    paths:
      - '.github/workflows/test-hosted-lab.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test hosted lab v2
        shell: bash
        run: |
          set +e
          URL='https://uoydoungeplepusrsill.supabase.co/functions/v1/product-importer-lab'
          GET_CODE=$(curl -sS -o lab.html -w '%{http_code}' "$URL")
          SHULE_CODE=$(curl -sS -o shule.json -w '%{http_code}' -X POST "$URL" -H 'content-type: application/json' -H 'x-lab-key: lab_7f2e8a6c9d1145caa54f' --data '{"url":"https://www.shulebags.com/giglio-spor-omuz-cantasi-vizon"}')
          NIS_CODE=$(curl -sS -o nis.json -w '%{http_code}' -X POST "$URL" -H 'content-type: application/json' -H 'x-lab-key: lab_7f2e8a6c9d1145caa54f' --data '{"url":"https://www.nisantasishoes.com/lorea-kahve-saten-puantiye-desenli-fiyonk-detayli-kadin-topuklu-ayakkabi-14833?numara=39"}')
          export GET_CODE SHULE_CODE NIS_CODE
          python - <<'PY'
          import json, os
          def read(path):
              try:
                  with open(path,encoding='utf-8') as f:return json.load(f)
              except Exception as e:return {'error':str(e)}
          def compact(d,code):
              return {'http':int(code or 0),'name':d.get('name'),'price':d.get('price'),'discountPrice':d.get('discountPrice'),'images':len(d.get('images') or []),'colors':d.get('colors') or [],'sizes':d.get('sizes') or [],'source':d.get('source'),'error':d.get('error')}
          html=open('lab.html',encoding='utf-8').read()
          out={'get_http':int(os.environ.get('GET_CODE','0')),'get_has_lab_title':'مختبر استيراد المنتجات' in html,'shulebags':compact(read('shule.json'),os.environ.get('SHULE_CODE','0')),'nisantasishoes':compact(read('nis.json'),os.environ.get('NIS_CODE','0'))}
          open('hosted-lab-smoke-results.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hosted-lab-smoke-results.json
          git diff --cached --quiet || git commit -m 'Record hosted lab smoke results'
          git push
